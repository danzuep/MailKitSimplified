name: 🚀 Deploy to NuGet
run-name: Deploy ${{ inputs.project-name }} NuGet package

on:
  workflow_call:
    inputs:
      environment:
        description: 'The build environment'
        default: development
        type: string
      owner:
        description: 'GitHub repository owner name'
        default: danzuep
        type: string
      project-name:
        description: 'The name of the project'
        required: true
        type: string
      version:
        description: 'Package version suffix'
        required: true
        type: string

jobs:
  deploy:
    name: 🚀 ${{ inputs.project-name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.environment }}
    env:
      PACKAGE_NAMES: '${{ inputs.project-name }}.*.nupkg'

    steps:
      # https://github.com/actions/download-artifact/blob/main/docs/MIGRATION.md
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.project-name }}
          path: .
          merge-multiple: true

      - name: Get .NET externals
        uses: actions/setup-dotnet@v6

      - name: List files in the folder
        run: find . -name "*.nupkg" -type f -exec echo {} \;
      # run: Get-ChildItem -Path "./.nupkg" | Where-Object {$_.PSIsContainer -eq $false} | SELECT Name
  
      # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: NuGet login (OIDC trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ inputs.owner }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push $PACKAGE_NAMES --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Markdown workflow job summary
        run: echo "### ${{ inputs.project-name }}.*.${{ inputs.version }}.nupkg packages published" >> $GITHUB_STEP_SUMMARY
